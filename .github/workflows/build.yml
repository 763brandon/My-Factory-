name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push should cancel the first; a phone IDE does not need three
# concurrent CI runs of the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # :core needs neither the Android SDK nor a device, so it runs first and
      # fails fast. This is most of the project's coverage.
      - name: Run core tests
        run: ./gradlew :core:test --stacktrace

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 7

  build:
    name: Build APKs and AAB
    runs-on: ubuntu-latest
    needs: jvm-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK and CMake
        run: |
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # armeabi-v7a is the whole point of this fork. If the 32-bit library
      # stops being produced, that must fail the build rather than ship a
      # silently terminal-less APK to the devices that need it most.
      - name: Verify every ABI carries the native terminal
        run: |
          set -e
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            apk="app/build/outputs/apk/debug/app-$abi-debug.apk"
            if ! unzip -l "$apk" | grep -q "lib/$abi/libforgepty.so"; then
              echo "::error::$apk is missing libforgepty.so for $abi"
              exit 1
            fi
            echo "ok: $abi"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 14

  instrumented:
    name: Instrumented tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: jvm-tests
    strategy:
      fail-fast: false
      matrix:
        # The floor, a mid-point, and current. x86_64 images are what CI can
        # actually run; the 32-bit ARM path still needs a real device and is
        # documented as such in the README.
        api: [24, 28, 30, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api >= 30 && 'google_apis' || 'default' }}
          disable-animations: true
          script: |
            ./gradlew :core:test
            ./gradlew :runtime-linux:connectedDebugAndroidTest
            ./gradlew :data:connectedDebugAndroidTest
            ./gradlew :app:connectedDebugAndroidTest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # No NDK here: this also proves the -Pforge.buildNative=false path still
      # produces a working build, which is what a contributor without the NDK
      # will do.
      - name: Lint without the NDK
        run: ./gradlew :app:lintDebug -Pforge.buildNative=false --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
