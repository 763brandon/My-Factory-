# ---------------------------------------------------------------------------
# JVM settings. 2 GB is enough for this project and keeps CI runners honest.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---------------------------------------------------------------------------
# AndroidX / Kotlin
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Project switches
#
# forge.buildNative   Compile the JNI PTY bridge. Requires the NDK. Set to
#                     false to produce a build without a real terminal; the
#                     app detects the missing library and degrades.
# forge.abiSplits     Emit one APK per ABI in addition to the universal APK.
# ---------------------------------------------------------------------------
forge.buildNative=true
forge.abiSplits=true
